[project]
name = "shifttrace-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agora-agents>=2.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=1.2,<2",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
